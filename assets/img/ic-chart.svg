<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="ict icd" font-family="'IBM Plex Mono',ui-monospace,monospace">
<title id="ict">Forecast strength before and after the quarantined test</title>
<desc id="icd">Dollar-neutral model scored 0.019 in testing and 0.024 on held-out data. Long-only model scored 0.025 in testing and 0.036 on held-out data.</desc>
<g fill="#93A3AD" font-size="13">
  <text x="0" y="14" fill="#EDF1F3" font-size="14">Forecast strength (information coefficient)</text>
  <text x="0" y="34">higher is better &#183; 0 means no skill at all</text>
</g>
<g stroke="#232C34" stroke-width="1">
  <line x1="92" y1="270" x2="740" y2="270"/><line x1="92" y1="212" x2="740" y2="212"/>
  <line x1="92" y1="154" x2="740" y2="154"/><line x1="92" y1="96" x2="740" y2="96"/>
</g>
<g fill="#93A3AD" font-size="12" text-anchor="end">
  <text x="80" y="274">0</text><text x="80" y="216">0.01</text><text x="80" y="158">0.02</text><text x="80" y="100">0.03</text>
</g>
<g><title>Dollar-neutral model, in testing: 0.0188</title><rect x="150" y="161" width="54" height="109" rx="4" fill="#3987e5"/></g>
<g><title>Dollar-neutral model, held-out data: 0.0241</title><rect x="210" y="130" width="54" height="140" rx="4" fill="#d95926"/></g>
<g fill="#EDF1F3" font-size="12" text-anchor="middle">
  <text x="177" y="152">0.019</text><text x="237" y="121">0.024</text>
</g>
<g><title>Long-only model, in testing: 0.0245</title><rect x="470" y="128" width="54" height="142" rx="4" fill="#3987e5"/></g>
<g><title>Long-only model, held-out data: 0.0357</title><rect x="530" y="63" width="54" height="207" rx="4" fill="#d95926"/></g>
<g fill="#EDF1F3" font-size="12" text-anchor="middle">
  <text x="497" y="119">0.025</text><text x="557" y="54">0.036</text>
</g>
<g fill="#93A3AD" font-size="12" text-anchor="middle">
  <text x="207" y="294">Dollar-neutral model</text><text x="527" y="294">Long-only model</text>
</g>
<g font-size="12">
  <rect x="92" y="315" width="11" height="11" rx="2" fill="#3987e5"/><text x="110" y="325" fill="#93A3AD">In testing</text>
  <rect x="196" y="315" width="11" height="11" rx="2" fill="#d95926"/><text x="214" y="325" fill="#93A3AD">Held-out data it had never seen</text>
</g>
</svg>
