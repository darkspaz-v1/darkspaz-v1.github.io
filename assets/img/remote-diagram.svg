<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Diagram: a campus laptop reaches a home laptop two hours away over a private encrypted network, using remote desktop, SSH and continuous folder sync, with the home machine waking on a schedule" font-family="'IBM Plex Mono',ui-monospace,monospace">
<defs><marker id="ra" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#3d4a54"/></marker></defs>
<rect x="14" y="108" width="168" height="96" rx="8" fill="#1b232a" stroke="#2f3a43"/>
<text x="98" y="146" fill="#EDF1F3" font-size="13" text-anchor="middle">Laptop at college</text>
<text x="98" y="168" fill="#5f6d78" font-size="11" text-anchor="middle">where I am</text>
<rect x="578" y="108" width="168" height="96" rx="8" fill="#1b232a" stroke="#2f3a43"/>
<text x="662" y="146" fill="#EDF1F3" font-size="13" text-anchor="middle">Laptop at home</text>
<text x="662" y="168" fill="#5f6d78" font-size="11" text-anchor="middle">two hours away</text>
<rect x="222" y="60" width="316" height="196" rx="10" fill="#161d23" stroke="#FFB547" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="380" y="86" fill="#FFB547" font-size="12" text-anchor="middle">private encrypted network</text>
<g fill="#1b232a" stroke="#2f3a43"><rect x="244" y="102" width="272" height="40" rx="6"/><rect x="244" y="150" width="272" height="40" rx="6"/><rect x="244" y="198" width="272" height="40" rx="6"/></g>
<g fill="#EDF1F3" font-size="12"><text x="262" y="127">Remote desktop</text><text x="262" y="175">Shell over SSH</text><text x="262" y="223">Folder sync, both ways</text></g>
<g fill="#5f6d78" font-size="11" text-anchor="end"><text x="500" y="127">screen + keyboard</text><text x="500" y="175">one-off commands</text><text x="500" y="223">notes and files</text></g>
<g stroke="#3d4a54" stroke-width="1.5" fill="none"><path d="M182 156 L238 156" marker-end="url(#ra)"/><path d="M522 156 L574 156" marker-end="url(#ra)"/></g>
<text x="380" y="288" fill="#93A3AD" font-size="12" text-anchor="middle">home machine wakes itself three times a day, on a schedule I can change remotely</text>
<text x="380" y="310" fill="#5f6d78" font-size="11" text-anchor="middle">no ports opened on either router &#183; nothing stored on a company&#8217;s server</text>
</svg>
