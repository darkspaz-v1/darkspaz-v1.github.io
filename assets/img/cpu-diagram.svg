<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Planned 8-bit CPU: a clock and control unit driving two registers, an adder, memory and a display over a shared bus" font-family="'IBM Plex Mono',ui-monospace,monospace">
<g fill="#161d23" stroke="#2f3a43">
  <rect x="20" y="40" width="132" height="64" rx="6"/><rect x="20" y="136" width="132" height="64" rx="6"/>
  <rect x="300" y="40" width="160" height="64" rx="6"/><rect x="300" y="136" width="160" height="64" rx="6"/>
  <rect x="604" y="40" width="136" height="64" rx="6"/><rect x="604" y="136" width="136" height="64" rx="6"/>
</g>
