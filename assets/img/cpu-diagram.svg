</g>
<rect x="20" y="248" width="720" height="26" rx="4" fill="#1b232a" stroke="#FFB547" stroke-dasharray="5 4"/>
<text x="380" y="266" fill="#FFB547" font-size="12" text-anchor="middle">8-bit shared bus</text>
<g stroke="#3d4a54" stroke-width="1.5" fill="none">
  <path d="M86 200 L86 248"/><path d="M380 200 L380 248"/><path d="M672 200 L672 248"/>
  <path d="M86 104 L86 136"/><path d="M380 104 L380 136"/><path d="M672 104 L672 136"/>
