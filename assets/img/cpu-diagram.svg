  <text x="380" y="70">Registers A / B</text><text x="380" y="166">Adder</text>
  <text x="672" y="70">Memory</text><text x="672" y="166">Display</text>
</g>
<g fill="#5f6d78" font-size="11" text-anchor="middle">
